services:
  # FastAPI Environmental Intelligence Backend
  - type: web
    name: palar-guard-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python -m app.seed_data"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./palar_guard.db
      - key: CORS_ORIGINS
        value: "https://palar-guard-ai.vercel.app,http://localhost:5173"
      - key: SECRET_KEY
        generateValue: true

  # Static Frontend Single Page Application
  - type: web
    name: palar-guard-ai-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: palar-guard-ai-backend
          property: host
