services:
  # FastAPI Environmental Intelligence Backend on Render
  - type: web
    name: palar-guard-ai-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # Optional: set DATABASE_URL (PostgreSQL) in Render Dashboard Environment;
      # when unset, FastAPI safely uses sqlite:///./palar_guard.db on free instances.
      - key: CORS_ORIGINS
        value: "https://frontend-tau-kohl-99.vercel.app,https://frontend-6xbla5345-kayalvizhij-2008-its-projects.vercel.app"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_ACCOUNT_EMAIL
        value: "demo@palarguard.ai"
      - key: DEMO_ACCOUNT_PASSWORD
        value: "PalarDemo@2026"
      # Set INITIAL_ADMIN_EMAIL and INITIAL_ADMIN_PASSWORD in Render Dashboard (or run python -m app.provision_admin)
